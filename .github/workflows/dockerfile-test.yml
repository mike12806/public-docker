name: docker-build-verification
# Builds run on the self-hosted Docker-in-Docker runner (self-hosted-dind); the rest on self-hosted.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the PR cancels the older run: image builds are the heaviest
# jobs on the self-hosted Docker-in-Docker runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every pinned version in a Dockerfile must be one Renovate can update.
  renovate-dockerfile-versions:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # One matrix entry per Dockerfile, so every image keeps its check, but only
  # the images this PR changes (their directory, or the Runner smoke test) get
  # built. A change to this workflow builds them all.
  discover-dockerfiles:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit and its parents: the first is the base branch.
          fetch-depth: 2

      - id: find
        run: |
          # Without a merge commit to diff against, build everything.
          changed() { ! git rev-parse -q --verify HEAD^2 >/dev/null || ! git diff --quiet HEAD^1 HEAD -- "$@"; }
          build_all=false
          if changed .github/workflows/dockerfile-test.yml; then build_all=true; fi

          matrix=$(find Dockerfiles -mindepth 2 -maxdepth 2 -name Dockerfile | sort | while read -r dockerfile; do
            context=$(dirname "$dockerfile")
            # Same name as the published image (publish-runner-image.yml), so
            # PR builds read the cache that main's builds write.
            image=$(echo "$context" | sed 's|^Dockerfiles/||' | tr '/.' '-' | tr '[:upper:]' '[:lower:]')
            inputs=("$context")
            if [ "$context" = Dockerfiles/Runner ]; then inputs+=(tests/runner-smoke.sh); fi
            build=$build_all
            if changed "${inputs[@]}"; then build=true; fi
            jq -nc --arg dockerfile "$dockerfile" --arg context "$context" --arg image "$image" --argjson build "$build" \
              '{dockerfile: $dockerfile, context: $context, image: $image, build: $build}'
          done | jq -sc .)

          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "found=$(echo "$matrix" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build-and-test (${{ matrix.dockerfile }})
    needs: discover-dockerfiles
    if: needs.discover-dockerfiles.outputs.found == 'true'
    # An image this PR doesn't change only reports its check, so it doesn't
    # need (or hold) a Docker-in-Docker runner.
    runs-on: ${{ matrix.build && 'self-hosted-dind' || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-dockerfiles.outputs.matrix) }}

    steps:
      - name: Unchanged in this PR
        if: ${{ !matrix.build }}
        run: echo "This PR doesn't change ${{ matrix.context }} or its tests, so it isn't rebuilt."

      - uses: actions/checkout@v7
        if: matrix.build

      # No setup-buildx-action: the default builder's docker driver builds
      # straight into the engine's (containerd) image store, which can still
      # export to the GHA cache. A docker-container builder takes ~25s to start
      # and then has to load the image into the engine for the smoke test
      # (4 min for the Runner image).
      - uses: docker/build-push-action@v7
        if: matrix.build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: "test-${{ matrix.image }}:${{ github.sha }}"
          # Reads the cache main's publish builds write (one scope per image:
          # images sharing a scope overwrite each other's cache). PR builds
          # don't write it: exporting means compressing and uploading every
          # stage's layers one at a time, which took 17 min on a cold Runner
          # build, and only a second push to the same PR would reuse it.
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Smoke test
        if: matrix.build
        run: |
          image_tag="test-${{ matrix.image }}:${{ github.sha }}"
          if [[ "${{ matrix.dockerfile }}" == *"Runner"* ]]; then
            tests/runner-smoke.sh "$image_tag" "${{ matrix.dockerfile }}"
            exit $?
          fi
          if [[ "${{ matrix.dockerfile }}" == *"Kubectl"* ]]; then
            echo "Testing kubectl image with Redis..."
            docker run --rm --entrypoint /bin/sh "$image_tag" -c "kubectl version --client && redis-cli --version"
            exit $?
          fi
          docker run --rm --entrypoint /bin/sh "$image_tag" -c "ls /"
          result=$?
          if [ $result -eq 0 ]; then
            exit 0
          fi
          if [ $result -eq 127 ]; then
            echo "No shell, try default entrypoint"
            timeout 10 docker run --rm "$image_tag"
            rc=$?
            if [ $rc -eq 124 ]; then
              echo "Timeout"
              exit 1
            elif [ $rc -ne 0 ]; then
              echo "Exited nonzero"
              exit 1
            fi
            exit 0
          fi
          echo "Unknown failure"
          exit 1
