name: Build and Publish Docker Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
  push:
    branches: [main]
    paths:
      - 'Dockerfiles/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          create_annotated_tag: true
          tag_prefix: v

      # The tag action returns an empty version when HEAD is already tagged
      # (the weekly rebuild with no new commits), which produced image tags
      # like "runner:". Fall back to the version tag already on HEAD.
      - name: Resolve image version
        id: version
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          version="$NEW_VERSION"
          if [ -z "$version" ]; then
            version=$(git ls-remote --tags origin \
              | awk -v sha="$GITHUB_SHA" '$1==sha {print $2}' \
              | sed -E 's#^refs/tags/v##; s#\^\{\}$##' | sort -V | tail -1)
            echo "HEAD already tagged; rebuilding version ${version:-<none>}"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve an image version for $GITHUB_SHA"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Discover Dockerfiles
        id: discover
        run: |
          files=$(find Dockerfiles -mindepth 2 -maxdepth 2 -name Dockerfile)
          matrix=$(echo "$files" | jq -R -s -c 'split("\n")[:-1] | {dockerfile: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-matrix:
    needs: build-and-push
    runs-on: self-hosted-dind
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-and-push.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # A docker-container builder (unlike the PR workflow's docker driver)
      # pushes an unchanged image without pulling its cached layers: GHCR
      # already has them. The runner pod is ephemeral, so skip removing it.
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name and context
        id: meta
        run: |
          context_path=$(dirname "${{ matrix.dockerfile }}")
          image_name=$(echo "$context_path" | sed 's|^Dockerfiles/||' | tr '/.' '-' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$image_name" ]]; then image_name="docker"; fi
          echo "context_path=$context_path" >> $GITHUB_OUTPUT
          echo "image_name=$image_name" >> $GITHUB_OUTPUT

      - name: Set tags
        id: tags
        run: |
          echo "tags=${{ env.REGISTRY }}/${{ github.repository_owner }}/public-docker/${{ steps.meta.outputs.image_name }}:${{ needs.build-and-push.outputs.version }},${{ env.REGISTRY }}/${{ github.repository_owner }}/public-docker/${{ steps.meta.outputs.image_name }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: "${{ steps.meta.outputs.context_path }}"
          file: "${{ matrix.dockerfile }}"
          push: true
          tags: "${{ steps.tags.outputs.tags }}"
          # One scope per image (the PR workflow reads the same ones): images
          # sharing a scope overwrite each other's cache. The weekly rebuild
          # skips the cache so it still picks up OS package updates.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.image_name }}

      - name: Show Image Info
        run: |
          echo "Image: ${{ steps.tags.outputs.tags }}"
          echo "Version: ${{ needs.build-and-push.outputs.version }}"
          echo "Tag: ${{ needs.build-and-push.outputs.tag }}"

  release:
    needs: [build-matrix, build-and-push]
    # Only cut a release when this run created a new tag.
    if: needs.build-and-push.outputs.tag != ''
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configuration: |
            {
              "template": "## What's Changed\n\n${UNCATEGORIZED}\n\n## Docker Image Details\n- Repository: `${{ env.REGISTRY }}/${{ github.repository_owner }}/public-docker`\n- Version: `${{ needs.build-and-push.outputs.version }}`\n- Git SHA: `${{ github.sha }}`",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "enhancement"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["documentation", "docs"]
                },
                {
                  "title": "## 🔄 Dependencies",
                  "labels": ["dependencies", "dependency"]
                },
                {
                  "title": "## 🛠 Maintenance",
                  "labels": ["maintenance", "chore"]
                },
                {
                  "title": "## Other Changes",
                  "labels": []
                }
              ],
              "ignore_labels": ["duplicate", "invalid", "question", "wontfix"]
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push.outputs.tag }}
          name: ${{ needs.build-and-push.outputs.version }}
          body: ${{ steps.github_release.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Release Info
        run: |
          echo "Version: ${{ needs.build-and-push.outputs.version }}"
          echo "Tag: ${{ needs.build-and-push.outputs.tag }}"
